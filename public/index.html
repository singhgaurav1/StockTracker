<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1117" />
    <title>Stock Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="view-pick" class="view view-pick">
        <header class="brand">
          <p class="eyebrow">Stock Tracker</p>
          <h1>See an option’s payoff across prices and time.</h1>
          <p class="lede">Pick a stock, choose an expiration and a call or put, then calculate a scenario table that fits on your screen.</p>
        </header>
        <form id="ticker-form" class="search-card">
          <label for="ticker-input">Stock ticker</label>
          <div class="search-row">
            <input id="ticker-input" name="ticker" inputmode="latin" autocomplete="off" spellcheck="false" maxlength="10" placeholder="AAPL" />
            <button type="submit" id="lookup-btn">Look up</button>
          </div>
        </form>
        <div class="chips" id="popular-chips"></div>
        <p id="pick-error" class="banner error" hidden></p>
      </section>

      <section id="view-trade" class="view view-trade" hidden>
        <header class="topbar">
          <button type="button" class="text-btn" id="back-pick">Stocks</button>
          <strong id="trade-symbol"></strong>
          <button type="button" class="text-btn" id="refresh-btn">Refresh</button>
        </header>

        <article class="quote-card compact">
          <div class="quote-head">
            <div class="quote-main">
              <h2 id="company-name"></h2>
              <div class="quote-line">
                <div id="stock-price" class="price"></div>
                <div id="price-change" class="change"></div>
              </div>
            </div>
            <div id="hv-pill" class="pill">HV —</div>
          </div>
          <div class="chart-toolbar">
            <div class="segmented mini" id="chart-toggle" role="tablist" aria-label="Chart type">
              <button type="button" data-chart="price" class="active">Price</button>
              <button type="button" data-chart="iv">Hist IV</button>
            </div>
            <div class="periods compact" id="period-toggle">
              <button type="button" data-period="1m">1M</button>
              <button type="button" data-period="3m" class="active">3M</button>
              <button type="button" data-period="6m">6M</button>
              <button type="button" data-period="1y">1Y</button>
            </div>
          </div>
          <div class="chart-block">
            <div id="price-chart" class="chart chart-compact" aria-hidden="true"></div>
            <p id="chart-caption" class="chart-caption"></p>
          </div>
          <dl class="stats stats-inline" id="stock-stats"></dl>
        </article>

        <article class="trade-card">
          <div class="trade-controls">
            <label class="field compact-field">
              <span class="section-title">Expiration</span>
              <select id="expiry-select"></select>
            </label>
            <div class="segmented mini" role="tablist" aria-label="Option type">
              <button type="button" id="type-call" class="active">Call</button>
              <button type="button" id="type-put">Put</button>
            </div>
          </div>
          <div class="chain-head">
            <span class="section-title">Option chain</span>
          </div>
          <div class="chain-scroll">
            <table class="chain-table" id="chain-table" aria-label="Option chain">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <p id="trade-error" class="banner error" hidden></p>
        </article>
      </section>

      <section id="view-results" class="view view-results" hidden>
        <header class="results-bar">
          <button type="button" class="text-btn" id="back-trade">Edit</button>
          <div class="results-summary">
            <strong id="result-title"></strong>
            <span id="result-sub"></span>
          </div>
        </header>
        <div class="controls">
          <div class="strike-window">
            <label class="strike-input">
              <span>Min strike</span>
              <input id="strike-min-input" type="number" inputmode="decimal" step="0.5" />
            </label>
            <div class="strike-slider">
              <input id="strike-min-range" type="range" />
              <input id="strike-max-range" type="range" />
            </div>
            <label class="strike-input">
              <span>Max strike</span>
              <input id="strike-max-input" type="number" inputmode="decimal" step="0.5" />
            </label>
          </div>
          <div class="segmented mini" role="tablist" aria-label="Display mode">
            <button type="button" id="mode-multiple" class="active">Multiple</button>
            <button type="button" id="mode-pct">%</button>
          </div>
        </div>
        <div id="heatmap" class="heatmap" role="table" aria-label="Option scenario table"></div>
        <p class="hint">Rows are future stock prices. Columns are dates until expiry.</p>
      </section>

      <footer id="calculate-bar" class="bottom-bar" hidden>
        <div class="bottom-bar-copy">
          <strong id="selected-contract"></strong>
          <span id="selected-premium"></span>
        </div>
        <button type="button" class="primary" id="calculate-btn">Calculate</button>
      </footer>

      <dialog id="help-modal" class="help-modal">
        <h3 id="help-title"></h3>
        <p id="help-body"></p>
        <button type="button" class="primary" id="help-close">Got it</button>
      </dialog>

      <p id="status" class="toast" hidden></p>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
